[project]
name = "pyrecords"
version = "0.2.0"
description = "Read records from Excel or JSON, then order, filter (JSON rules) and group them."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "aaltatan", email = "a.altatan@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pyordering>=0.1.3",
    "pyspecification>=4.0.0",
]
keywords = ["records", "excel", "json", "filter", "order-by", "group-by"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aaltatan/pyrecords"
Repository = "https://github.com/aaltatan/pyrecords"
Issues = "https://github.com/aaltatan/pyrecords/issues"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=9.1.1", "pytest-cov>=7.0", "ruff>=0.8", "types-openpyxl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pyrecords"]
branch = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "I", "N", "D", "UP", "YTT", "ANN", "ASYNC", "S", "BLE", "FBT", "B",
    "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "FA", "ISC", "ICN", "LOG", "G", "INP", "PIE",
    "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TC", "INT", "ARG",
    "PTH", "TD", "FIX", "PGH", "PL", "TRY", "FLY", "PERF", "FURB", "RUF",
]
ignore = [
    "ANN201",  # missing return type for public function
    "ANN401",  # typing.Any
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # missing docstrings
    "D203", "D211", "D212", "D213",  # conflicting docstring layouts
    "COM812",  # conflicts with the formatter
    "PT",  # flake8-pytest-style
    "UP045",  # Optional[X] vs X | None
    "INP001",  # implicit namespace package
    "S101",  # assert
    "PLR2004",  # magic values in comparisons
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyspecification.*", "pyordering.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# filter rules compare untyped column values; the decorators come from untyped libraries
module = ["pyrecords.filter_rules", "pyrecords.transformers"]
disable_error_code = ["no-any-return", "untyped-decorator"]
